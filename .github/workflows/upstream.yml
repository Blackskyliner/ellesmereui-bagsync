# Weekly run against EllesmereUI's newest commit instead of the pinned one
# (scripts/setup-tools.sh, ELLESMEREUI_REV). A failure here means an
# EllesmereUI update needs attention before the pin moves: an EllesmereUI
# symbol the connector relies on changed, or EllesmereUI started calling a
# client API the simulator lacks (sim/EllesmereUIBags_Alts_SimTests/SimGaps.lua).
name: Upstream EllesmereUI

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-ellesmereui:
    name: Checks against the newest EllesmereUI
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ELLESMEREUI_REV: latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Same cache as the CI simulator job; EllesmereUI itself is not cached.
      - name: Cache toolchain and simulator build
        uses: actions/cache@v6
        with:
          path: |
            .tools/lua
            .tools/luarocks
            .tools/rocks
            .tools/cargo
            .tools/vendor/wow-ui-sim
          key: sim-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}

      - name: Set up toolchain, newest EllesmereUI and simulator
        run: scripts/setup-tools.sh --no-gui

      - name: EllesmereUI revision
        run: git -C .tools/vendor/EllesmereUI log -1 --format='%H %cd %s'

      - name: Run checks with the simulator
        run: scripts/test.sh --require-sim
