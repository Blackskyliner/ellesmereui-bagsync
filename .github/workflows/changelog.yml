# Checks the CHANGELOG.md section of the TOC version with the same script the
# release workflow runs on a tag (scripts/release-check.sh): the section exists
# and its entries carry a New/Enhanced/Bugfix/Removed prefix, in that order.
# CI skips Markdown changes, so without this job a broken section would only
# show when the release fails on the tag.
name: Changelog

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - EllesmereUIBags_Alts/EllesmereUIBags_Alts.toc
      - scripts/release-check.sh
      - .github/workflows/changelog.yml
  pull_request:
    paths:
      - CHANGELOG.md
      - EllesmereUIBags_Alts/EllesmereUIBags_Alts.toc
      - scripts/release-check.sh
      - .github/workflows/changelog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog section of the TOC version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the section
        run: |
          version="$(sed -n 's/^## Version: *//p' EllesmereUIBags_Alts/EllesmereUIBags_Alts.toc | tr -d '\r')"
          scripts/release-check.sh "$version" "$RUNNER_TEMP/release-notes.md"
